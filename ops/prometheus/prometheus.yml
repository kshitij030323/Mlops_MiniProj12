global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    dns_sd_configs: [{names: [api], type: A, port: 8000}]
  - job_name: agent-worker          # resolves every replica when scaled with --scale agent-worker=N
    dns_sd_configs: [{names: [agent-worker], type: A, port: 9100}]
  - job_name: verifier
    dns_sd_configs: [{names: [verifier], type: A, port: 8082}]
  - job_name: llm-stub
    dns_sd_configs: [{names: [llm-stub], type: A, port: 8090}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
